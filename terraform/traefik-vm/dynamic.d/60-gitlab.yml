http:
  routers:
    gitlab:
      rule: "Host(`gitlab.lab.hezebonica.ca`)"
      entryPoints: [websecure]
      service: gitlab
      tls:
        certResolver: cloudflare

  services:
    gitlab:
      loadBalancer:
        servers:
          # GitLab webservice, exposed via MetalLB at 192.168.57.102:8080.
          # Plain HTTP upstream — the GitLab chart's ingress is disabled
          # (apps/gitlab/values.yaml in homelab-platform); Traefik terminates
          # HTTPS at the edge with the wildcard cert, matching the
          # harbor/vault pattern.
          # loadBalancerIP is pinned to .102 in apps/gitlab/values.yaml; if the
          # MetalLB pool or pin ever changes, update this URL to match.
          - url: "http://192.168.57.102:8080"
